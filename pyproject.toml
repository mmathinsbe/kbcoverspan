[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmathinsbe-kbcoverspan"
version = "0.1.0"
description = "在同一个输入里两两比对，检测知识库的覆盖与时效相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mmathinsbe" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mmathinsbe.github.io"
Repository = "https://github.com/mmathinsbe/kbcoverspan"
Issues = "https://github.com/mmathinsbe/kbcoverspan/issues"

[project.scripts]
kbcoverspan = "kbcoverspan:main"

[tool.setuptools]
py-modules = ["kbcoverspan"]
